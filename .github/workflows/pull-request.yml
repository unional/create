name: pull-request
on:
  pull_request:
    types: [opened, synchronize]
  merge_group:

# Least privilege at the workflow level; the reusable workflow raises what it needs
# per job (actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  code:
    uses: cyberuni/.github/.github/workflows/pnpm-verify.yml@v2
    with:
      os: '["ubuntu-latest"]'
      skip-playwright: true
