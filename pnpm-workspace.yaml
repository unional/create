packages:
  - packages/*

# Supply-chain soak. The previous form lived in `.npmrc` as `minimumreleaseage=1440`,
# which is not a valid npm/pnpm key: `pnpm config get minimumReleaseAge` returned
# `undefined` and npm itself warned `Unknown project config "minimumreleaseage"`, so
# no version was ever held back. Declared here it is typed config and actually applies.
# `minimumReleaseAgeStrict` makes it apply to transitive resolutions too, not only
# direct dependencies. Nothing is excluded; if an install trips the gate, pin an older
# mature version rather than widening an exclude list.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# Every one of these is a postinstall we do not need: `core-js` and `nx` only print
# donation/telemetry banners, and `@parcel/watcher` builds a native watcher that
# nothing in this repo watches. Omitting an entry re-triggers ERR_PNPM_IGNORED_BUILDS,
# so they are listed explicitly as `false` rather than left out.
allowBuilds:
  '@parcel/watcher': false
  core-js: false
  nx: false

# Restores exactly what the deleted `yarn.lock` had resolved. These are floating `^`
# ranges in package.json that have drifted since the last release in 2021 — for
# example @types/update-notifier 5.1.0 broke its own ConfigStore typing (TS2709).
#
# `clibuilder` used to be pinned here too. That was the wrong place: an override binds
# this workspace only, so the published `^6.5.1` ranges still resolved to 6.6.1 for
# consumers, where `createCli` no longer exists. The constraint now lives in each
# package's own `dependencies` as `~6.5.1`.
overrides:
  '@types/ramda': 0.32.0
  '@types/update-notifier': 5.0.0
  ansi-colors: 4.1.1
  configstore: 5.0.1
  find-installed-packages: 2.1.6
  iso-error: 3.2.5
  search-packages: 2.1.0
